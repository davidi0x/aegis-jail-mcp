[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-mcp-jail"
dynamic = ["version"]
description = "Least-privilege sandbox for AI agents and MCP servers: no home dir, no credentials, no network unless verified as needed."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ai", "agents", "mcp", "sandbox", "security", "least-privilege", "claude-code", "prompt-injection"]
dependencies = []
classifiers = [
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
]

[project.scripts]
aegis = "aegis_jail.cli:main"
aegis-mcp-jail = "aegis_jail.cli:main"

[tool.setuptools.dynamic]
version = {attr = "aegis_jail.__version__"}

[project.urls]
Homepage = "https://github.com/IwanskyDD/aegis-mcp-jail"
Issues = "https://github.com/IwanskyDD/aegis-mcp-jail/issues"

[tool.setuptools.packages.find]
include = ["aegis_jail*"]

[tool.setuptools.package-data]
aegis_jail = ["demo/*", "demo/*/*", "demo/.aegis/*", "demo/.aegis/*/*"]
