<text x="956.0" y="158" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">apply / discard</text>
<rect x="308" y="84" width="432" height="116" rx="16" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="8 6"/>
<text x="524.0" y="78" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">inside the OS sandbox · no home dir · no keys · network off or allowlisted</text>
<text x="550" y="242" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Nothing reaches your real project until you run  aegis apply.</text>
<text x="550" y="270" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Changes that could run code outside the sandbox (hooks, CI, MCP config, scripts) need an explicit yes.</text>
</svg>