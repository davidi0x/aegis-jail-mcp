<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-label="aegis mcp-jail sits between your MCP client and an MCP server">
<defs><marker id="a58a6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="abc8cff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/></marker></defs>
<rect width="1100" height="430" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="550" y="42" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">aegis mcp-jail: run any MCP server without trusting it</text>
<rect x="30" y="110" width="190" height="220" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="125" y="150" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MCP client</text>
<text x="125" y="180" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Claude Code</text>
<text x="125" y="202" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Claude Desktop</text>
<text x="125" y="224" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Cursor · VS Code</text>
<text x="125" y="262" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">your model sees only</text>
<text x="125" y="282" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">filtered, clean tools</text>
<rect x="300" y="80" width="500" height="290" rx="16" fill="#1d1535" stroke="#bc8cff" stroke-width="1.5"/>
<text x="550" y="110" fill="#bc8cff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">AEGIS MCP JAIL</text>
<circle cx="326" cy="138" r="5" fill="#bc8cff"/>
<text x="342" y="143" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Tool firewall</text>
<text x="540" y="143" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">--allow-tools / --deny-tools globs</text>
<circle cx="326" cy="178" r="5" fill="#bc8cff"/>
<text x="342" y="183" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Rug-pull protection</text>
<text x="540" y="183" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">definitions pinned; a change hides it</text>
<circle cx="326" cy="218" r="5" fill="#bc8cff"/>
<text x="342" y="223" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Poisoning filter</text>
<text x="540" y="223" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">hidden instructions &amp; invisible Unicode</text>
<circle cx="326" cy="258" r="5" fill="#bc8cff"/>
<text x="342" y="263" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Secret egress block</text>
<text x="540" y="263" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">no credentials in tool arguments</text>
<circle cx="326" cy="298" r="5" fill="#bc8cff"/>
<text x="342" y="303" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Sampling guard</text>
<text x="540" y="303" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">server can't drive your model</text>
<circle cx="326" cy="338" r="5" fill="#bc8cff"/>
<text x="342" y="343" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Audit log</text>
<text x="540" y="343" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">~/.aegis/mcp/&lt;name&gt;.jsonl</text>
<rect x="880" y="110" width="190" height="220" rx="12" fill="#2d1417" stroke="#f85149" stroke-width="1.5"/>
<text x="975" y="150" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">MCP server</text>
<text x="975" y="180" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">inside the sandbox:</text>
<text x="975" y="206" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">✕ home directory</text>
<text x="975" y="228" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">✕ credentials</text>
<text x="975" y="250" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">✕ network (unless listed)</text>
<text x="975" y="272" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">✕ other processes</text>
<line x1="222" y1="190" x2="296" y2="190" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a58a6ff)"/>
<line x1="296" y1="250" x2="222" y2="250" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a58a6ff)"/>
<line x1="802" y1="190" x2="876" y2="190" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#abc8cff)"/>
<line x1="876" y1="250" x2="802" y2="250" stroke="#bc8cff" stroke-width="2.5" marker-end="url(#abc8cff)"/>
<text x="550" y="404" fill="#39c5cf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" font-weight="400" text-anchor="middle">aegis mcp-jail --allow-hosts api.github.com --deny-tools "delete_*" -- npx -y @modelcontextprotocol/server-github</text>
</svg>