name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      HYDRA_REQUIRE_SANDBOX: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Hydra
        run: python -m pip install .
      - name: Doctor
        run: hydra doctor
      - name: Unit + sandbox tests
        run: python -m unittest discover -s tests -t . -v
      - name: Boundary probe on the demo project
        run: hydra probe --project examples/demo-project
      - name: Demo run (scripted agent)
        if: runner.os != 'Windows'
        run: hydra run --project examples/demo-project
