name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      AEGIS_REQUIRE_SANDBOX: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Aegis
        run: python -m pip install .
      - name: Doctor
        run: aegis doctor
      - name: Unit + sandbox tests
        run: python -m unittest discover -s tests -t . -v
      - name: Demo (prompt-injected agent, contained)
        run: aegis demo
      - name: Boundary probe on the demo project
        run: aegis probe --project aegis_jail/demo
      - name: README links, anchors and images
        if: runner.os == 'Linux'
        run: python scripts/check_docs.py
      - name: Plugin entry point works without installation
        run: python scripts/aegis.py --version
