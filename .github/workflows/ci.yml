name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the default token can only read the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run (never on main, so every main commit is tested).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Everything compiles
        run: python -m compileall -q aegis_jail tests scripts
      - name: Manifests and workflow files parse
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import json, pathlib, sys, yaml
          bad = 0
          for f in [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", ".mcp.json", "hooks/hooks.json",
                    *map(str, pathlib.Path("aegis_jail/demo/.aegis").rglob("*.json"))]:
              try:
                  json.loads(pathlib.Path(f).read_text(encoding="utf-8"))
              except ValueError as e:
                  print(f"{f}: invalid JSON: {e}"); bad += 1
          for f in [*pathlib.Path(".github").rglob("*.yml"), *pathlib.Path(".github").rglob("*.yaml")]:
              try:
                  yaml.safe_load(f.read_text(encoding="utf-8"))
              except yaml.YAMLError as e:
                  print(f"{f}: invalid YAML: {e}"); bad += 1
          sys.exit(1 if bad else 0)
          PY
      - name: Every action is pinned to a commit
        run: |
          if grep -rEn 'uses: [^#]*@' .github/workflows | grep -Ev '@[0-9a-f]{40}( |$)'; then
            echo "::error::pin every action to a full commit SHA"; exit 1
          fi
      - name: install.sh passes shellcheck
        run: shellcheck -S warning scripts/install.sh
      - name: README links, anchors and images
        run: python scripts/check_docs.py

  powershell:
    name: install.ps1 parses
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.10", "3.13"]   # the oldest and the newest we support
    env:
      AEGIS_REQUIRE_SANDBOX: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Aegis
        run: python -m pip install .
      - name: Doctor
        run: aegis doctor
      - name: Unit + sandbox tests
        run: python -m unittest discover -s tests -t . -v
      - name: Demo (prompt-injected agent, contained)
        run: aegis demo
      - name: Boundary probe on the demo project
        run: aegis probe --project aegis_jail/demo
      - name: Plugin entry point works without installation
        run: python scripts/aegis.py --version

  package:
    name: build and install the wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: A clean install from the wheel works and ships the demo
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheelenv/bin/aegis" --version
          "$RUNNER_TEMP/wheelenv/bin/python" - <<'PY'
          import pathlib, aegis_jail
          root = pathlib.Path(aegis_jail.__file__).parent / "demo"
          for rel in (".aegis/task.json", ".aegis/profiles/default.json", "src/calc.py", "tools/scripted_agent.py"):
              assert (root / rel).exists(), f"{rel} is missing from the wheel"
          for rel in ("index.html", "app.js", "app.css"):
              assert (root.parent / "web" / rel).exists(), f"dashboard {rel} is missing from the wheel"
          PY
